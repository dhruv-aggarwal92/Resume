<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhruv Aggarwal · Backend Developer</title>
<meta name="description" content="Interactive 3D resume of Dhruv Aggarwal — Backend Developer (Node.js). Explore the services, switch themes, or open the terminal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ───────────── Theme tokens ───────────── */
:root, body[data-theme="neon"] {
  --bg:#07020f; --fg:#efe9ff; --muted:#a79bc9; --accent:#ff2bd6; --accent2:#00f0ff;
  --panel:rgba(16,6,34,.80); --border:rgba(255,43,214,.38); --chip:rgba(0,240,255,.08); --chip-b:rgba(0,240,255,.35);
  --mark:rgba(255,43,214,.22); --head:'Orbitron',sans-serif; --body:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
  --glow:0 0 32px rgba(255,43,214,.25); --radius:14px; --label-shadow:0 0 14px rgba(0,0,0,.9);
}
body[data-theme="space"] {
  --bg:#02030a; --fg:#eef2ff; --muted:#9aa4c7; --accent:#ffcf70; --accent2:#6ec6ff;
  --panel:rgba(8,12,30,.76); --border:rgba(110,198,255,.32); --chip:rgba(110,198,255,.08); --chip-b:rgba(110,198,255,.32);
  --mark:rgba(255,207,112,.2); --head:'Space Grotesk',sans-serif; --body:'Space Grotesk',sans-serif;
  --glow:0 0 40px rgba(110,198,255,.18); --radius:20px;
}
body[data-theme="matrix"] {
  --bg:#000; --fg:#c8ffd9; --muted:#4fbf7a; --accent:#00ff66; --accent2:#b4ffcf;
  --panel:rgba(0,12,4,.88); --border:rgba(0,255,102,.4); --chip:rgba(0,255,102,.07); --chip-b:rgba(0,255,102,.35);
  --mark:rgba(0,255,102,.2); --head:'JetBrains Mono',monospace; --body:'JetBrains Mono',monospace;
  --glow:0 0 30px rgba(0,255,102,.2); --radius:2px;
}
body[data-theme="blueprint"] {
  --bg:#0d3a75; --fg:#f2f7ff; --muted:#a9c4ea; --accent:#ffd166; --accent2:#ffffff;
  --panel:rgba(10,46,98,.9); --border:rgba(255,255,255,.45); --chip:rgba(255,255,255,.06); --chip-b:rgba(255,255,255,.4);
  --mark:rgba(255,209,102,.22); --head:'JetBrains Mono',monospace; --body:'Inter',sans-serif;
  --glow:none; --radius:0px; --label-shadow:none;
}
body[data-theme="paper"] {
  --bg:#f2ede3; --fg:#1d1d1f; --muted:#6b665c; --accent:#e4572e; --accent2:#2e86ab;
  --panel:rgba(255,252,246,.94); --border:rgba(29,29,31,.14); --chip:rgba(46,134,171,.08); --chip-b:rgba(46,134,171,.3);
  --mark:rgba(243,167,18,.28); --head:'Fraunces',serif; --body:'Inter',sans-serif;
  --glow:0 18px 50px rgba(29,29,31,.12); --radius:16px; --label-shadow:none;
}
/* Anime themes — every section has its own style (a bankai / a breathing technique).
   The accent follows the open section; the per-section --accent/--kanji overrides are
   generated from STYLES in the script. */
body[data-theme="bankai"] {
  --bg:#0a0507; --fg:#f5efe6; --muted:#a8968f; --accent:#e5162f; --accent2:#f5efe6; --radius:3px;
  --kanji:"斬"; --kanji-big:"卍解"; --wm-size:150px;
}
body[data-theme="breathing"] {
  --bg:#07080c; --fg:#f3efe8; --muted:#a39d93; --accent:#ff8a3d; --accent2:#ffd27a; --radius:4px;
  --kanji:"日"; --kanji-big:"全集中"; --wm-size:150px;
}
:is(body[data-theme="bankai"],body[data-theme="breathing"]) {
  --panel:color-mix(in srgb,color-mix(in srgb,var(--bg) 92%,var(--accent)) 88%,transparent); --border:color-mix(in srgb,var(--accent) 45%,transparent);
  --chip:color-mix(in srgb,var(--accent) 7%,transparent); --chip-b:color-mix(in srgb,var(--accent2) 30%,transparent);
  --mark:color-mix(in srgb,var(--accent) 28%,transparent); --glow:0 0 36px color-mix(in srgb,var(--accent) 22%,transparent);
  --head:'Shippori Mincho',serif; --body:'Inter',sans-serif; --label-shadow:0 0 14px rgba(0,0,0,.95);
}

/* ───────────── Base ───────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;transition:background .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}

/* ───────────── Node labels (CSS2D) ───────────── */
.nl{pointer-events:none}
.nl-in{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 10px;border-radius:10px;border:1px solid transparent;transition:opacity .35s,background .2s,border-color .2s,transform .2s;user-select:none;white-space:nowrap}
.nl-n{font:600 10px var(--mono);color:var(--accent2);letter-spacing:.18em}
.nl-t{font:700 14px var(--head);color:var(--fg);letter-spacing:.07em;text-transform:uppercase;text-shadow:var(--label-shadow)}
.nl-p{font:500 10px var(--mono);color:var(--muted);text-shadow:var(--label-shadow)}
.nl-core .nl-t{font-size:19px;letter-spacing:.12em}
.nl.hover .nl-in,.nl-in:hover{background:var(--panel);border-color:var(--border);transform:scale(1.06)}
body.focused .nl .nl-in{opacity:.28}
body.focused .nl.active .nl-in{opacity:1}
body[data-theme="blueprint"] .nl-in{border:1px dashed rgba(255,255,255,.45);border-radius:0}
.sat{font:600 10px var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--border);padding:2px 6px;border-radius:6px;white-space:nowrap;pointer-events:none;transform:translateY(-14px)}

/* ───────────── HUD ───────────── */
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;pointer-events:none;z-index:5;gap:12px}
.hud > *{pointer-events:auto}
.brand .name{font:800 22px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
body[data-theme="paper"] .brand .name{text-transform:none;letter-spacing:0;font-size:26px}
.brand .role{font:500 13px var(--mono);color:var(--muted);margin-top:3px}
.status{display:flex;align-items:center;gap:7px;font:500 11px var(--mono);color:var(--accent2);margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border:1px solid var(--border);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:calc(var(--radius) * .7);font:600 12px var(--mono);text-decoration:none;color:var(--fg);transition:border-color .2s,transform .15s,box-shadow .2s}
.btn:hover{border-color:var(--accent);box-shadow:var(--glow);transform:translateY(-1px)}
.btn .ic{color:var(--accent)}

/* ───────────── Section nav ───────────── */
#nav{position:fixed;left:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:5}
#nav button{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 10px;border-radius:10px;font:500 12px var(--mono);color:var(--muted);text-align:left;border:1px solid transparent;transition:all .2s}
#nav button .i{font-size:10px;opacity:.6;width:16px}
#nav button .m{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--chip);color:var(--accent2);border:1px solid var(--chip-b)}
#nav button .m.post{color:var(--accent);border-color:var(--accent)}
#nav button:hover,#nav button.on{color:var(--fg);background:var(--panel);border-color:var(--border)}
#nav button.on .p{color:var(--accent)}

/* ───────────── Theme dock ───────────── */
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:6;box-shadow:var(--glow);max-width:calc(100vw - 24px)}
.dock-label{font:700 10px var(--mono);letter-spacing:.2em;color:var(--muted);padding:0 8px 0 10px}
#dock button{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;font:600 12px var(--body);color:var(--muted);transition:all .2s;white-space:nowrap}
#dock button .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.4);flex:none}
#dock button:hover{color:var(--fg)}
#dock button[aria-checked="true"]{background:var(--chip);color:var(--fg);box-shadow:inset 0 0 0 1px var(--chip-b)}

.hint{position:fixed;left:22px;bottom:24px;font:500 11px var(--mono);color:var(--muted);line-height:1.7;z-index:4;transition:opacity .6s}
.hint kbd{font:inherit;padding:1px 6px;border:1px solid var(--border);border-radius:4px;color:var(--fg)}
.hint.gone{opacity:0;pointer-events:none}

/* ───────────── Panel ───────────── */
#panel{position:fixed;top:84px;right:20px;bottom:84px;width:min(540px,44vw);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--glow);z-index:8;transform:translateX(calc(100% + 40px));transition:transform .6s cubic-bezier(.2,.9,.2,1);overflow:hidden}
#panel.open{transform:none}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);font:500 12px var(--mono)}
.req{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.method{font-weight:700;font-size:11px;padding:3px 7px;border-radius:5px;background:var(--chip);color:var(--accent2);border:1px solid var(--chip-b)}
.method.post{color:var(--accent);border-color:var(--accent)}
.path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resp{display:flex;gap:10px;color:var(--muted);font-size:11px;white-space:nowrap}
.code{color:#2bd47d;font-weight:700}
.code.pending{color:var(--accent)}
.close{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--border);flex:none}
.close:hover{border-color:var(--accent);color:var(--accent)}
.p-tabs{display:flex;gap:4px;padding:8px 14px 0}
.p-tabs button{font:600 11px var(--mono);padding:6px 12px;border-radius:8px 8px 0 0;color:var(--muted);border-bottom:2px solid transparent}
.p-tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.p-body{flex:1;overflow:auto;padding:20px 22px 26px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.p-title{font:700 28px var(--head);letter-spacing:.03em;margin-bottom:14px;text-transform:uppercase}
body[data-theme="paper"] .p-title{text-transform:none;font-size:34px}
.p-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--border);font:500 11px var(--mono);color:var(--muted)}
.p-foot button{padding:6px 10px;border-radius:8px;border:1px solid var(--border);color:var(--fg)}
.p-foot button:hover{border-color:var(--accent)}
.p-content{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}

/* content blocks */
.p-content h3{font:700 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.lead{font-size:15px;line-height:1.7}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.stat{padding:14px;border:1px solid var(--border);border-radius:calc(var(--radius)*.7);background:var(--chip)}
.stat b{display:block;font:700 26px var(--head);color:var(--accent)}
.stat b small{font-size:13px;color:var(--muted);margin-left:2px}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--mono);padding:5px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-b);transition:all .2s}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
body[data-theme="blueprint"] .chip,body[data-theme="matrix"] .chip{border-radius:2px}
.chips.sm .chip{font-size:11px;padding:3px 8px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.skcat{margin-bottom:16px}
.skh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font:600 14px var(--body)}
.skh .idx{font:600 10px var(--mono);color:var(--accent)}
.skh .cnt{margin-left:auto;font:500 10px var(--mono);color:var(--muted)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--accent),var(--accent2),transparent)}
.tl-item{position:relative;margin-bottom:26px}
.tl-item:before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);box-shadow:0 0 12px var(--accent)}
.tl-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.co{font:700 17px var(--head)}
.ro{font-size:13px;color:var(--muted);margin-top:2px}
.pe{font:600 11px var(--mono);color:var(--accent2);white-space:nowrap;text-align:right}
details.sub{margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:calc(var(--radius)*.7);background:var(--chip)}
details.sub summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.sub summary::-webkit-details-marker{display:none}
details.sub summary:after{content:"+";font-family:var(--mono);color:var(--accent)}
details.sub[open] summary:after{content:"–"}
details.sub .chips{margin:10px 0 4px}
.bul{list-style:none;margin-top:8px}
.bul li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.6;margin:6px 0}
.bul li:before{content:"▸";position:absolute;left:0;color:var(--accent);font-size:11px;top:2px}
.card{padding:16px;border:1px solid var(--border);border-radius:calc(var(--radius)*.8);background:var(--chip);margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.card-h h4{font:700 16px var(--head)}
.edu{display:flex;gap:16px;align-items:center}
.ring{flex:none;position:relative;width:78px;height:78px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--mono);color:var(--accent)}
.ring .trk{stroke:var(--border)}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.2,1)}
.edu .meta{font-size:13px;color:var(--muted);margin-top:3px}
.edu .yr{font:600 11px var(--mono);color:var(--accent2);margin-top:6px}
.ach{display:flex;gap:14px;align-items:flex-start}
.ach .glyph{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--bg);border:1px solid var(--border);color:var(--accent)}
.ach h4{font:700 15px var(--head);margin-bottom:3px}
.ach p{font-size:13px;line-height:1.55;color:var(--fg);opacity:.9}
.ach .when{font:500 11px var(--mono);color:var(--muted);margin-top:4px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{display:block;padding:14px;border:1px solid var(--border);border-radius:calc(var(--radius)*.7);background:var(--chip);text-decoration:none;transition:all .2s;min-width:0}
.cbox:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--glow)}
.cbox small{display:block;font:600 10px var(--mono);letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.cbox span{display:block;font-size:13px;margin-top:5px;overflow-wrap:anywhere}
form.req-form{margin-top:8px;border:1px solid var(--border);border-radius:calc(var(--radius)*.7);overflow:hidden;font-family:var(--mono)}
.rf-h{padding:9px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--chip)}
.rf-b{padding:12px;display:grid;gap:8px;font-size:12px}
.rf-b label{color:var(--accent2)}
.rf-b input,.rf-b textarea{width:100%;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--border);border-radius:6px;padding:8px 10px;resize:vertical}
.rf-b input:focus,.rf-b textarea:focus{outline:none;border-color:var(--accent)}
.rf-b button{justify-self:start;padding:8px 14px;border-radius:6px;background:var(--accent);color:var(--bg);font-weight:700}
pre.json{font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.jk{color:var(--accent2)} .js{color:var(--fg);opacity:.85} .jn{color:var(--accent)} .jb{color:var(--accent)}
.resp-out{margin-top:10px}

/* ───────────── Terminal ───────────── */
#term{position:fixed;left:50%;bottom:0;width:min(780px,96vw);height:min(48vh,440px);transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);z-index:20;display:flex;flex-direction:column;background:rgba(4,6,8,.94);border:1px solid rgba(255,255,255,.14);border-bottom:0;border-radius:12px 12px 0 0;font:13px/1.55 'JetBrains Mono',monospace;color:#d6e2ea;box-shadow:0 -20px 60px rgba(0,0,0,.4)}
#term.open{transform:translate(-50%,0)}
.t-bar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;color:#7b8a96}
.t-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.t-bar .tt{margin-left:8px;flex:1}
.t-bar button{color:#7b8a96;font-size:12px}
#termOut{flex:1;overflow:auto;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.t-row{display:flex;gap:8px;padding:8px 14px 12px;border-top:1px solid rgba(255,255,255,.06)}
.t-ps{color:#4ade80;white-space:nowrap}
.t-ps b{color:#60a5fa;font-weight:500}
#termIn{flex:1;background:none;border:0;color:#fff;font:inherit;outline:none;caret-color:#4ade80}
.tc-a{color:#4ade80}.tc-b{color:#60a5fa}.tc-m{color:#7b8a96}.tc-y{color:#facc15}.tc-p{color:#f472b6}.tc-e{color:#f87171}
#termOut a{color:#60a5fa}
#term .jk{color:#60a5fa} #term .js{color:#d6e2ea;opacity:1} #term .jn,#term .jb{color:#facc15}

/* ───────────── Classic view ───────────── */
#classic{position:fixed;inset:0;z-index:30;background:rgba(10,10,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto;display:none}
#classic.open{display:block}
.c-bar{position:sticky;top:0;display:flex;justify-content:center;gap:8px;padding:12px;z-index:2}
.c-bar .btn{background:#fff;color:#111;border-color:#ddd}
.c-bar .btn .ic{color:#e4572e}
.sheet{max-width:860px;margin:0 auto 60px;background:#fff;color:#1a1a1a;padding:56px 60px;font:14px/1.55 'Inter',sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.3);border-radius:4px}
.sheet h1{font:700 34px 'Fraunces',serif;letter-spacing:-.01em}
.sheet .sub{color:#555;margin-top:4px}
.sheet .ct{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.sheet .ct a{color:#2e5fa7;text-decoration:none}
.sheet h2{font:600 13px 'Inter',sans-serif;letter-spacing:.16em;text-transform:uppercase;border-bottom:1.5px solid #1a1a1a;padding-bottom:4px;margin:24px 0 10px}
.sheet .row{display:flex;justify-content:space-between;gap:12px}
.sheet .row b{font-weight:600}
.sheet .row i{color:#555;white-space:nowrap}
.sheet ul{margin:4px 0 8px 18px}
.sheet li{margin:3px 0}
.sheet .st{margin-top:10px}
.sheet .st > div:first-child{font-weight:600}
.sheet .tools{font-style:italic;color:#555;font-size:12.5px}
.sheet p{margin:4px 0}

/* ───────────── Boot ───────────── */
#boot{position:fixed;inset:0;z-index:50;background:#000;color:#4ade80;font:13px/1.8 'JetBrains Mono',monospace;padding:clamp(20px,6vw,70px);transition:opacity .7s;cursor:pointer}
#boot.gone{opacity:0;pointer-events:none}
#boot .ok{color:#4ade80}#boot .dim{color:#5b6b63}#boot .hi{color:#fff}

  return `<div class="ring"><svg width="78" height="78" viewBox="0 0 78 78"><circle class="trk" cx="39" cy="39" r="${r}" fill="none" stroke-width="5"/><circle class="bar" cx="39" cy="39" r="${r}" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" data-off="${off.toFixed(1)}"/></svg><div class="v">${esc(show)}</div></div>`;
};

function sectionData(id) {
  const R = RESUME;
  return {
    about: { name: R.name, role: R.role, education: `${R.degree}, ${R.school}`, summary: R.summary, focus: R.focus },
    skills: Object.fromEntries(R.skills.map(s => [s.cat, s.items])),
    experience: R.experience,
    projects: R.projects,
    education: R.education.map(({ show, value, max, ...e }) => e),
    achievements: R.achievements.map(({ glyph, ...a }) => a),
    contact: R.contact
  }[id];
}

function jsonHTML(obj) {
  return JSON.stringify(obj, null, 2).replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?/g, (m, str, colon, kw) => {
    if (str) return `<span class="${colon ? 'jk' : 'js'}">${esc(str)}</span>${colon || ''}`;
    return `<span class="${kw ? 'jb' : 'jn'}">${m}</span>`;
  });
}

function renderContent() {
  if (!current) return;
  pContent.innerHTML = tab === 'json' ? `<pre class="json">${jsonHTML(sectionData(current))}</pre>` : RENDER[current]();
  pContent.style.animation = 'none'; void pContent.offsetWidth; pContent.style.animation = '';
  requestAnimationFrame(() => setTimeout(() => pContent.querySelectorAll('.ring .bar').forEach(b => b.style.strokeDashoffset = b.dataset.off), 60));
}
function openSection(id) {
  const i = SECTIONS.findIndex(s => s.id === id);
  if (i < 0) return;
  const s = SECTIONS[i];
  current = id;
  const m = panel.querySelector('.method');
  m.textContent = s.method; m.classList.toggle('post', s.method === 'POST');
  panel.querySelector('.path').textContent = '/api/v1' + s.path;
  const code = panel.querySelector('.code');
  code.textContent = s.method === 'POST' ? 'AWAITING BODY' : '200 OK';
  code.classList.toggle('pending', s.method === 'POST');
  panel.querySelector('.lat').textContent = (8 + Math.floor(Math.random() * 34)) + ' ms';
  $('#pTitle').textContent = s.title;
  $('#pTitle').dataset.kanji = s.kanji;
  $('#pPos').textContent = `${i + 1} / ${SECTIONS.length}`;
  renderContent();
  pBody.scrollTop = 0;
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
  body.classList.add('focused');
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  const st = STYLES[theme] && STYLES[theme][id];
  if (st && body.dataset.sec !== id && !reduceMotion) { slash(st.col); toast(`${STYLE_CALL[theme]} · ${st.big} — ${st.name}`); }
  body.dataset.sec = id;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  window.Scene3D && window.Scene3D.focus(id);
  dismissHint();
}
function closeSection() {
  if (!current) return;
  current = null;
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
  body.classList.remove('focused');
  delete body.dataset.sec;
  nav.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  window.Scene3D && window.Scene3D.home();
}
function step(d) {
  const i = SECTIONS.findIndex(s => s.id === current);

}

function paintDock() { dock.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.theme === theme))); }
function paintBody(id) {
  body.dataset.theme = id;
  const S = STYLES[id]; // per-section styles of the anime themes → nav glyphs + colours
  nav.querySelectorAll('button').forEach(b => {
    const st = S && S[b.dataset.id];
    b.querySelector('.k').textContent = st ? st.k : '';
    b.style.setProperty('--c', st ? st.col : 'var(--accent)');
    b.title = st ? `${st.big} · ${st.name}` : '';
  });
}
function slash(color) { const sl = $('#slash'); sl.style.setProperty('--s', color); sl.classList.remove('go'); void sl.offsetWidth; sl.classList.add('go'); }
function setTheme(id, quiet) {
  const t = THEMES.find(x => x.id === id); if (!t) return false;
  theme = id;
  try { localStorage.setItem('dhruv-theme', id); } catch (e) {}
  paintDock();
  const warp = $('#warp');
  warp.style.background = `radial-gradient(circle at 50% 50%, transparent 0, ${t.bg} 70%)`;
  if (quiet || reduceMotion) { paintBody(id); window.Scene3D && window.Scene3D.applyTheme(id); return true; }
  warp.classList.add('on');
  if (t.slash) slash(current && STYLES[id] ? STYLES[id][current].col : t.slash);
  setTimeout(() => {
    paintBody(id);
    window.Scene3D && window.Scene3D.applyTheme(id, true);
    warp.classList.remove('on');
    toast(id === 'bankai' ? '卍解 — every section releases its own bankai' : id === 'breathing' ? '全集中 — every section breathes its own style' : `theme → ${t.label}`);
  }, 230);
  return true;
}
function cycleTheme() { const i = THEMES.findIndex(t => t.id === theme); setTheme(THEMES[(i + 1) % THEMES.length].id); }
dock.addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.theme !== theme) setTheme(b.dataset.theme); });

}

});

const BOOT = [

  for (let k = 0; k < BOLTN; k++) {
    const f = k / (BOLTN - 1), p = start.clone().lerp(end, f);
    if (k && k < BOLTN - 1) { const j = 2 * (1 - f * 0.6); p.x += (rnd() - 0.5) * j; p.z += (rnd() - 0.5) * j; p.y += (rnd() - 0.5) * j * 0.4; }
    main.push(p);
  }
  setBolt(bolts[0], main);
  setBolt(bolts[1], main.map(p => p.clone().add(new THREE.Vector3(0.08, 0, 0.08))));
  const from = main[6], dir = new THREE.Vector3(rnd() - 0.5, -0.8, rnd() - 0.5).normalize(), branch = [];
  for (let k = 0; k < BOLTN; k++) { const p = from.clone().addScaledVector(dir, k * 0.4); if (k) { p.x += (rnd() - 0.5) * 0.8; p.z += (rnd() - 0.5) * 0.8; } branch.push(p); }
  setBolt(bolts[2], branch);
  boltLife = 1; n.boost = Math.max(n.boost, 0.6);
}

/* Breathing: a sword-swing trail circling every node in its style's colour */
function trailGeo(rad) {
  const ARC = Math.PI * 1.3, g = new THREE.TorusGeometry(rad, 0.055, 6, 100, ARC), pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    let a = Math.atan2(pos.getY(i), pos.getX(i)); if (a < 0) a += TAU;
    const f = Math.pow(Math.min(1, a / ARC), 2);
    col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = f;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
nodes.forEach(n => {
  n.trail = new THREE.Mesh(trailGeo(n.r * (n.isCore ? 1.75 : 1.95)), new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  n.trail.visible = false;
  n.group.add(n.trail);
});

/* Click pulse */
const pulse = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 64), new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide, depthWrite: false }));
pulse.visible = false; scene.add(pulse);
let pulseT = 1;
function burst(id) {
  const n = nodeMap[id]; if (!n) return;
  pulse.position.copy(n.group.position); pulse.lookAt(camera.position); pulseT = 0; pulse.visible = true;
  pulse.material.color.set(STY ? STY[id].col : TH.p2);
  n.boost = 1;
}

/* ───────── Theme application ───────── */
let TH = THEMES.neon, fovKick = 0;
function applyTheme(name, animate) {
  TH = THEMES[name] || THEMES.neon;
  const th = TH;
  scene.background = th.matrix ? mTex : new THREE.Color(th.bg);
  scene.fog = new THREE.FogExp2(th.bg, th.fog);
  bloom.enabled = !!th.bloom;
  if (th.bloom) [bloom.strength, bloom.radius, bloom.threshold] = th.bloom;
  ambient.intensity = th.ambient; sun.intensity = th.dir;
  coreLight.color.set(th.core); coreLight.intensity = th.bloom ? 14 : 18;

  const blend = th.additive ? THREE.AdditiveBlending : THREE.NormalBlending;
  STY = th.perNode ? STYLES[name] : null;
  const per = !!STY; // anime themes: each node uses its own style colours
  nodes.forEach(n => {
    const st = per && STY[n.id];
    const col = new THREE.Color(per ? st.col : n.isCore ? th.core : th.palette[(n.i - 1) % th.palette.length]);
    const m = n.solid.material;
    const body = per && st.solid ? new THREE.Color(st.solid) : col; // e.g. Tensa Zangetsu's black core
    m.color.copy(body); m.emissive.copy(body); m.emissiveIntensity = th.emissive;
    n.el.style.setProperty('--c', per ? st.col : '');
    n.el.querySelector('.nl-b').textContent = per ? `${st.big} · ${st.name}` : '';
    m.opacity = th.solidOpacity; m.depthWrite = th.solidOpacity > 0.5;
    m.roughness = th.rough; m.metalness = th.metal; m.needsUpdate = true;
    n.wire.material.color.set(per ? st.wire || st.c2 : th.wire); n.wire.material.opacity = th.wireOpacity;
    n.ring.visible = th.rings;
    n.ring.material.color.set(name === 'blueprint' ? '#ffd166' : col); n.ring.material.opacity = name === 'blueprint' ? 0.5 : 0.45;
    n.trail.visible = per; n.trail.material.color.set(per ? st.c2 : '#ffffff');
  });
  gyro.visible = !per; // the Sun corona replaces the core's gyroscope rings
  gyroRings.forEach((g, k) => { g.material.color.set(k ? th.p1 : th.wire); g.material.opacity = th.additive ? 0.8 : 0.6; });
  sats.forEach((s, k) => {
    const c = new THREE.Color(per ? (k % 2 ? STY.skills.c2 : STY.skills.col) : th.palette[k % th.palette.length]);
    s.m.material.color.copy(c); s.m.material.emissive.copy(c); s.m.material.emissiveIntensity = Math.max(0.4, th.emissive);
  });
  links.forEach(l => { l.line.material.color.set(per ? STY[l.node.id].col : th.link); l.line.material.opacity = th.linkOpacity; l.line.material.blending = blend; l.line.material.needsUpdate = true; });
  const c1 = new THREE.Color(th.p1), c2 = new THREE.Color(th.p2);
  const linkCols = links.map(l => [new THREE.Color(STY[l.node.id].c2), new THREE.Color(STY[l.node.id].col)]);
  for (let k = 0; k < PCOUNT; k++) {
    const pair = per ? linkCols[(k / PER) | 0] : [c1, c2];
    (pDir[k] > 0 ? pair[0] : pair[1]).toArray(pCol, k * 3);
  }
  pGeo.attributes.color.needsUpdate = true;
  pMat.blending = blend; pMat.size = th.additive ? 0.26 : 0.2; pMat.needsUpdate = true;
  stars.visible = th.starOpacity > 0; stars.material.color.set(th.stars); stars.material.opacity = th.starOpacity;
  nebula.visible = th.nebula;
  petals.visible = !!th.petals;
  moon.visible = !!th.moon;
  fxPts.visible = per; if (per) seedFx();
  mistPts.visible = per && STY.education.id === 'mist';
  sakPts.visible = per && STY.skills.id === 'senbonzakura';
  bolts.forEach(b => b.visible = per && STY.projects.id === 'thunder'); boltMat.opacity = 0; boltLife = 0;
  pulse.material.color.set(th.p2); pulse.material.blending = blend; pulse.material.needsUpdate = true;
  buildGrid(th);
  drawWords(th);
  document.fonts && document.fonts.load(`600 46px "${th.wordFont}"`, WORDS.join('') + (th.kanji || []).join('')).then(() => { if (TH === th) drawWords(th); }).catch(() => {});
  if (animate && !reduceMotion) fovKick = 1;
}

/* ───────── Camera tweens ───────── */
let tween = null, focusedId = null;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function startTween(pos, tgt, dur = 1400) {
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, s: performance.now(), d: reduceMotion ? 1 : dur };
  controls.enabled = false;
}
function focus(id, silent) {
  const n = nodeMap[id]; if (!n) return;
  focusedId = id;
  controls.autoRotate = false;
  const p = n.group.position.clone();
  let out = n.isCore ? camera.position.clone().setY(0) : p.clone().setY(0);
  if (out.lengthSq() < 0.01) out.set(0, 0, 1);
  out.normalize();
  const dist = (n.isCore ? 11 : 8.8) + (isMobile() ? 3.5 : 0);
  const camEnd = p.clone().addScaledVector(out, dist).add(new THREE.Vector3(0, dist * 0.28, 0));
  const fwd = p.clone().sub(camEnd).normalize();
  const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
  const tgtEnd = isMobile() ? p.clone().add(new THREE.Vector3(0, -dist * 0.3, 0)) : p.clone().addScaledVector(right, dist * 0.36);
  startTween(camEnd, tgtEnd);
  nodes.forEach(m => m.el.classList.toggle('active', m.id === id));
  sats.forEach(s => s.lab.visible = id === 'skills');
  if (!silent) burst(id);
}
function home() {
  focusedId = null;
  nodes.forEach(m => m.el.classList.remove('active'));
  sats.forEach(s => s.lab.visible = false);
  startTween(HOME(), new THREE.Vector3(0, 0, 0), 1600);
  controls.autoRotate = true;
}
let externalHover = null, labelHover = null;
function hover(id) { externalHover = id; }

/* ───────── Picking ───────── */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(-9, -9);
let pickHover = null, needPick = false, downAt = null;
function pick() {
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(pickables, false);
  return h.length ? h[0].object.userData.node : null;
}
const cvs = renderer.domElement;
const setNdc = e => ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
cvs.addEventListener('pointermove', e => { setNdc(e); needPick = e.pointerType === 'mouse'; });
cvs.addEventListener('pointerleave', () => { ndc.set(-9, -9); needPick = true; });
cvs.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; UI.dismissHint(); });
cvs.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); downAt = null;
  if (moved > 6) return;
  setNdc(e);
  const n = pick();
  if (n) UI.isOpen() === n.id ? UI.closeSection() : UI.openSection(n.id);
});
controls.addEventListener('start', () => { tween = null; controls.enabled = true; });

/* ───────── Resize ───────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  if (focusedId) focus(focusedId, true);
});

/* ───────── Loop ───────── */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), xAxis = new THREE.Vector3(1, 0, 0);
addEventListener('boot-end', () => { if (!focusedId) startTween(HOME(), new THREE.Vector3(), 2600); }, { once: true });

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  // hover state
  if (needPick) { pickHover = pick(); needPick = false; }
  const hov = labelHover || (pickHover && pickHover.id) || externalHover;
  cvs.style.cursor = pickHover ? 'pointer' : '';
  nodes.forEach(n => {
    const isH = hov === n.id, isF = focusedId === n.id;
    n.target = isF ? 1.18 : isH ? 1.22 : 1;
    n.el.classList.toggle('hover', isH);
    n.scale += (n.target - n.scale) * Math.min(1, dt * 8);
    n.group.scale.setScalar(n.scale * (TH.breathing ? 1 + Math.sin(t * 1.8 + n.i * 0.6) * 0.045 : 1));
    const sp = n.spin * (isH || isF ? 2.4 : 1);
    n.solid.rotation.x += dt * sp * 0.7; n.solid.rotation.y += dt * sp;
    n.wire.rotation.x -= dt * sp * 0.35; n.wire.rotation.y -= dt * sp * 0.5;
    n.ring.rotation.z += dt * 0.25;
    n.boost = Math.max(0, n.boost - dt * 0.6);
  });
  gyro.rotation.y += dt * 0.35; gyro.rotation.z = Math.sin(t * 0.4) * 0.3;
  gyroRings[0].rotation.x += dt * 0.5; gyroRings[1].rotation.y += dt * 0.4;

  // skills satellites
  const sp = nodeMap.skills.group.position;
  sats.forEach(s => {
    const a = t * s.speed + s.phase;
    tmp.set(Math.cos(a) * s.rad, 0, Math.sin(a) * s.rad).applyAxisAngle(xAxis, s.tilt * 0.6).applyAxisAngle(up, s.tilt);
    s.m.position.copy(sp).add(tmp.multiplyScalar(nodeMap.skills.scale));
  });

  // event particles
  for (let L = 0; L < links.length; L++) {
    const l = links[L], n = l.node;
    const active = focusedId === n.id || hov === n.id;
    const mult = 1 + (active ? 2.2 : 0) + n.boost * 4;
    l.line.material.opacity = TH.linkOpacity * (active ? 1.8 : 1);
    for (let k = L * PER; k < (L + 1) * PER; k++) {
      let u = pT[k] + pS[k] * dt * mult * pDir[k];
      if (u > 1) u -= 1; else if (u < 0) u += 1;
      pT[k] = u;
      l.curve.getPoint(u, tmp);
      pPos[k * 3] = tmp.x; pPos[k * 3 + 1] = tmp.y; pPos[k * 3 + 2] = tmp.z;
    }
  }
  pGeo.attributes.position.needsUpdate = true;

  // environment
  wordGroup.rotation.y -= dt * 0.025;
  stars.rotation.y += dt * 0.004;
  if (grid && TH.gridScroll) grid.position.z = (t * 1.6) % 2.5;
  if (TH.matrix) { mAcc += dt; if (mAcc > 0.05) { mAcc = 0; drawMatrix(); } }
  if (petals.visible) {
    const fall = reduceMotion ? 0.25 : 1;
    for (let k = 0; k < PETALN; k++) {
      const i3 = k * 3;
      ptPos[i3] += Math.sin(t * 0.9 + ptPh[k]) * dt * 1.2 * fall + dt * 0.6 * fall;
      ptPos[i3 + 1] -= ptSp[k] * dt * fall;
      ptPos[i3 + 2] += Math.cos(t * 0.7 + ptPh[k]) * dt * 0.8 * fall;
      if (ptPos[i3 + 1] < -12) { ptPos[i3 + 1] = 32; ptPos[i3] = (Math.random() - 0.5) * 80; ptPos[i3 + 2] = (Math.random() - 0.5) * 80; }
      if (ptPos[i3] > 40) ptPos[i3] -= 80;
    }
    ptGeo.attributes.position.needsUpdate = true;
  }
  if (TH.perNode) {
    updateFx(dt, t, hov);
    // total concentration: the whole scene inhales and exhales
    if (TH.bloom) bloom.strength = TH.bloom[0] * (1 + Math.sin(t * 1.8) * 0.18);
    const s = reduceMotion ? 0.3 : 1;
    nodes.forEach(n => {
      const fast = focusedId === n.id || hov === n.id ? 2 : 1;
      n.trail.rotation.set(1.1 + Math.sin(t * 0.5 + n.i) * 0.35, n.i * 0.7, n.trail.rotation.z - dt * (2 + (n.i % 3) * 0.5) * s * fast);
    });
    // Thunder: lightning on the Projects node
    boltWait -= dt;
    if (boltWait <= 0 && !reduceMotion && bolts[0].visible) { strike(); boltWait = (focusedId === 'projects' ? 0.5 : 1.2) + rnd() * 2.2; }
    if (boltLife > 0) {
      boltLife = Math.max(0, boltLife - dt * 3.2);
      boltMat.opacity = boltLife * (0.6 + 0.4 * Math.sin(t * 90));
      ambient.intensity = TH.ambient + boltLife * 0.5;
    }
  }

  if (pulse.visible) {
    pulseT += dt * 1.4;
    const k = Math.min(pulseT, 1);
    pulse.scale.setScalar(1 + k * 5);
    pulse.material.opacity = (1 - k) * 0.8;
    pulse.lookAt(camera.position);
    if (k >= 1) pulse.visible = false;
  }

  // camera
  if (fovKick > 0) {
    fovKick = Math.max(0, fovKick - dt * 1.6);
    camera.fov = 50 + Math.sin(fovKick * Math.PI) * 14;
    camera.updateProjectionMatrix();
  }
  if (tween) {
    const k = Math.min(1, (performance.now() - tween.s) / tween.d), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    camera.position.y += Math.sin(e * Math.PI) * 2.5;
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.lookAt(controls.target);
    if (k >= 1) { tween = null; controls.enabled = true; controls.update(); }
  } else controls.update();

  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}

applyTheme(UI.getTheme());
window.Scene3D = { focus, home, applyTheme, hover, burst };
requestAnimationFrame(tick);
dispatchEvent(new Event('scene-ready'));
</script>
</body>
</html>
